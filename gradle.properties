# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# 强制使用 Android Studio 内置的 JBR 21（OpenJDK 21.0.8），避免 Oracle JDK 25 兼容性问题
# 2026-07-25: 曾用系统默认的 JDK 25，导致 JVM 在 checkDebugAarMetadata 阶段 OOM 崩溃
# 如需切换回系统默认 JDK，注释掉下面这行即可
org.gradle.java.home=D:/Android studio/jbr

# Specifies the JVM arguments used for the daemon process.
# 注意：堆内存 3G，配合 JBR 21 在 15G 物理内存机器上稳定运行
# 曾用 4G 仍 OOM（JDK 25 + 并行 + 配置缓存同时开启），降级到 3G + 关闭并行
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# 关闭并行：并行会同时启动多个 Kotlin daemon，加剧内存压力
org.gradle.parallel=false
# 启用构建缓存，加速重复构建（不影响内存）
org.gradle.caching=true
# 关闭配置缓存：配置缓存会占额外内存，15G 机器不适合开启
org.gradle.configuration-cache=false
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# 允许 KSP 等插件使用 kotlin.sourceSets DSL（AGP 9.1.0 内置 Kotlin 默认禁止）
# KSP 2.2.10-2.0.2 仍通过 kotlin.sourceSets 添加生成代码，需放开此限制
android.disallowKotlinSourceSets=false

# 抑制 AGP 9.1.0 对 compileSdk 37 的 warning（AGP 9.1.0 测试到 36.1，但实际兼容 37）
android.suppressUnsupportedCompileSdk=37

# HTTP/HTTPS 代理配置（2026-07-25）
# 仅在访问 github.com / services.gradle.org / jitpack.io 等境外资源时走代理
# 国内镜像（aliyun.com / tencent.com / tuna.tsinghua.edu.cn）直连，不走代理
# 临时关闭：代理服务未运行时会阻塞所有外部请求
# 如需启用，取消下面四行注释并确保代理服务运行中
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=35701
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=35701
systemProp.http.nonProxyHosts=localhost|127.*|[::1]|mirrors.aliyun.com|mirrors.cloud.tencent.com|mirrors.tuna.tsinghua.edu.cn|maven.aliyun.com
systemProp.https.nonProxyHosts=localhost|127.*|[::1]|mirrors.aliyun.com|mirrors.cloud.tencent.com|mirrors.tuna.tsinghua.edu.cn|maven.aliyun.com