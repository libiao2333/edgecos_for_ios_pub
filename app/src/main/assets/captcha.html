<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Captcha</title>
<script src="https://turing.captcha.qcloud.com/TCaptcha.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #6B7280;
    font-size: 14px;
  }
  #loading .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid #E2E5EA;
    border-top-color: #1A73E8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div>正在加载验证组件...</div>
</div>
<script>
  // 等待 TCaptcha.js 加载完成
  var captcha = null;
  var pendingAppId = null;

  function initWhenReady(appId) {
    pendingAppId = appId;
    if (typeof window.TencentCaptcha === 'undefined') {
      setTimeout(function() { initWhenReady(appId); }, 200);
      return;
    }
    document.getElementById('loading').style.display = 'none';
    captcha = new window.TencentCaptcha(appId, function(data) {
      // data: { ret, ticket, randstr, appid, ... }
      window.AndroidCaptcha.onResult(JSON.stringify(data));
    });
    // 通知原生层 SDK 已就绪
    window.AndroidCaptcha.onReady();
  }

  function show() {
    if (captcha) {
      captcha.show();
    } else {
      // SDK 未就绪，上报错误
      window.AndroidCaptcha.onError('Captcha SDK 未就绪');
    }
  }
</script>
</body>
</html>
